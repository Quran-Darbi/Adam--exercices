<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le jeu des paires – jeu pour Adam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:#fffaf0;color:#1f3a4d;min-height:100vh}
header{background:#ffd08a;padding:14px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:640px;margin:0 auto;padding:10px 14px 40px}
a.back{display:inline-block;text-decoration:none;color:#1f3a4d;background:#fff;border:3px solid #5aa9d6;border-radius:14px;padding:8px 14px;font-size:18px}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.opts button{font:inherit;font-size:17px;padding:10px 14px;border:3px solid #e8993a;background:#fff;border-radius:14px}
.opts button.on{background:#e8993a;color:#fff}
.hide{display:none!important}
.board{display:grid;gap:10px;margin:12px 0}
.k{aspect-ratio:3/4;perspective:600px;border:0;background:none;padding:0;font:inherit}
.k i{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.k.up i{transform:rotateY(180deg)}
.k b,.k u{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:4px solid #5aa9d6;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;padding:6px;text-decoration:none;font-weight:bold}
.k b{background:#8ecae6;font-size:44px;color:#fff}
.k u{background:#fff;transform:rotateY(180deg);font-size:46px}
.k.ok u{background:#c8efd6;border-color:#2f9e5b}
.k.bad u{background:#fde1de;border-color:#c0392b}
.d{width:18px;height:18px;border-radius:50%;border:2px solid}
.d.a{background:#1F5FBF;border-color:#123a78}.d.b{background:#E8730C;border-color:#8a3f00}
.stars{font-size:26px;text-align:center;min-height:36px}
.msg{font-size:22px;font-weight:bold;text-align:center;min-height:34px}
.big{font-size:64px;font-weight:bold;text-align:center}
.again{display:block;width:100%;font:inherit;font-size:24px;font-weight:bold;padding:14px;margin-top:10px;border-radius:18px;border:4px solid #5aa9d6;background:#fff}
.celeb{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.celeb span{position:absolute;top:-60px;animation:fall 1.7s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.celeb .banner{position:absolute;top:28%;left:50%;transform:translateX(-50%);background:#fff7d6;border:5px solid #e0a800;border-radius:24px;padding:14px 26px;font-size:38px;font-weight:bold;white-space:nowrap;animation:pp .6s}
@keyframes pp{50%{transform:translateX(-50%) scale(1.12)}}
</style>
</head>
<body>
<header>🃏 Le jeu des paires</header>
<main>
<a class="back" href="maths.html">⬅ Maths</a>
<div class="opts" id="lv">
  <button data-p="3" class="on">Niveau 1 : 3 paires</button>
  <button data-p="4">Niveau 2 : 4 paires</button>
  <button data-p="6">Niveau 3 : 6 paires</button>
</div>
<div class="opts" id="md">
  <button data-m="dots" class="on">🔵🟠 Ronds ↔ nombre</button>
  <button data-m="calc">➕ Calcul ↔ nombre</button>
</div>
<div class="msg" id="msg">Retrouve les paires !</div>
<div class="stars" id="stars"></div>
<div class="board" id="board"></div>
<div id="end" class="hide"><div class="big">🏆</div><div class="msg" id="score"></div><button class="again" id="again">🔁 Rejouer</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function celebrate(small){const o=document.createElement('div');o.className='celeb';const em=['🎉','⭐','✨','🌟','🎊'];
  let h=small?'':'<div class="banner">⭐ Bravo ! ⭐</div>';
  for(let i=0;i<(small?10:30);i++)h+='<span style="left:'+rnd(0,94)+'%;animation-delay:'+(Math.random()*.5).toFixed(2)+'s;font-size:'+rnd(24,42)+'px">'+em[rnd(0,4)]+'</span>';
  o.innerHTML=h;document.body.appendChild(o);setTimeout(()=>o.remove(),2300)}
let pairs=3,mode='dots',first=null,lock=false,found=0,tries=0;
function face(c){
  if(c.kind==='num')return String(c.s);
  if(mode==='calc')return c.a+' + '+c.b;
  let h='';for(let i=0;i<c.a;i++)h+='<span class="d a"></span>';for(let i=0;i<c.b;i++)h+='<span class="d b"></span>';return h;
}
function start(){
  first=null;lock=false;found=0;tries=0;$('end').classList.add('hide');$('stars').textContent='';$('msg').textContent='Retrouve les paires !';
  const sums=shuffle([2,3,4,5,6,7]).slice(0,pairs);
  let cards=[];
  sums.forEach((s,i)=>{const a=rnd(1,s-1);cards.push({id:i,kind:'q',s,a,b:s-a});cards.push({id:i,kind:'num',s})});
  cards=shuffle(cards);
  const cols=pairs===3?3:4;
  const bd=$('board');bd.style.gridTemplateColumns='repeat('+cols+',1fr)';
  bd.innerHTML=cards.map((c,i)=>'<button class="k" data-i="'+i+'"><i><b>❓</b><u'+(c.kind==='q'&&mode==='calc'?' style="font-size:30px"':'')+'>'+face(c)+'</u></i></button>').join('');
  [...bd.children].forEach((el,i)=>el.onclick=()=>flip(el,cards[i]));
}
function flip(el,c){
  if(lock||el.classList.contains('up'))return;
  el.classList.add('up');
  if(!first){first={el,c};return}
  tries++;
  const f=first;first=null;
  if(f.c.id===c.id&&f.c.kind!==c.kind){
    lock=true;
    setTimeout(()=>{f.el.classList.add('ok');el.classList.add('ok');celebrate(true);found++;lock=false;
      $('msg').textContent='Bravo ! '+f.c.s;
      if(found===pairs){setTimeout(finish,900)}},500);
  }else{
    lock=true;
    setTimeout(()=>{f.el.classList.add('bad');el.classList.add('bad')},450);
    setTimeout(()=>{f.el.classList.remove('up','bad');el.classList.remove('up','bad');lock=false;$('msg').textContent='Essaie encore 💪'},1700);
  }
}
function finish(){
  celebrate(false);
  const stars=tries<=pairs+1?3:tries<=pairs*2?2:1;
  $('stars').textContent='⭐'.repeat(stars);
  $('score').textContent='Terminé en '+tries+' essais !';$('end').classList.remove('hide');
}
$('again').onclick=start;
document.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lv button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pairs=+b.dataset.p;start()});
document.querySelectorAll('#md button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#md button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;start()});
start();
</script>
</body>
</html>
