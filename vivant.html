<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivant / Non vivant – jeu pour Adam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:#fffaf0;color:#1f3a4d;min-height:100vh}
header{background:#a8e0bd;padding:14px;text-align:center;font-size:24px;font-weight:bold}
nav{display:flex;gap:8px;padding:10px;justify-content:center;flex-wrap:wrap}
nav button{font:inherit;font-size:18px;padding:10px 16px;border:3px solid #5aa9d6;background:#fff;border-radius:14px}
nav button.on{background:#3f86b8;color:#fff}
main{max-width:640px;margin:0 auto;padding:10px 14px 40px}
.hide{display:none!important}
.card{background:#fff;border-radius:24px;border:4px solid #5aa9d6;text-align:center;padding:18px 10px;margin:8px 0}
.big{font-size:110px;line-height:1.1}
.word{font-size:36px;font-weight:bold;margin-top:6px}
.choices{display:flex;gap:12px}
.choices button{flex:1;font:inherit;font-size:24px;font-weight:bold;padding:20px 6px;border-radius:20px;border:4px solid;color:#fff}
#bV{background:#2f9e5b;border-color:#1f7a42}
#bN{background:#4f78c9;border-color:#34569e}
.stars{font-size:26px;text-align:center;min-height:36px}
.msg{font-size:24px;font-weight:bold;text-align:center;min-height:40px;margin:6px 0}
.ok{color:#1f7a42}.ko{color:#c0392b}
.hint{background:#fff7d6;border:3px dashed #e0a800;border-radius:16px;padding:10px;font-size:20px;text-align:center;margin-top:6px}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.15)}}
.next{display:block;width:100%;font:inherit;font-size:24px;font-weight:bold;padding:16px;margin-top:10px;border-radius:18px;border:4px solid #5aa9d6;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border:3px solid #5aa9d6;border-radius:18px;text-align:center;padding:10px 4px}
.mini .e{font-size:56px}.mini .w{font-size:20px;font-weight:bold}
h2{text-align:center;font-size:22px}
.q3{font-size:20px;background:#fff;border-radius:16px;padding:12px;border:3px solid #2f9e5b}
.sheet{background:#fff;padding:8px;border-radius:12px}
.cut{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cut .c{border:2px dashed #999;text-align:center;padding:10px 2px}
.cut .c .e{font-size:54px}.cut .c .w{font-size:18px;font-weight:bold}
.cut .c.v{background:#e6f6ea}.cut .c.n{background:#eceff2}
.note{font-size:16px;text-align:center;color:#555}
</style>
</head>
<body>
<header>🌱 Vivant ou non vivant ? 🪨</header>
<div style="text-align:center;padding-top:8px"><a href="sciences.html" style="text-decoration:none;color:#1f3a4d;background:#fff;border:3px solid #5aa9d6;border-radius:14px;padding:8px 14px;font-size:18px;display:inline-block">⬅ Sciences</a></div>
<nav>
  <button class="on" data-t="jeu">🎮 Jeu</button>
  <button data-t="signes">⭐ Les 8 signes</button>
  <button data-t="cartes">✂️ Cartes</button>
</nav>
<main>

<section id="jeu">
  <div class="stars" id="stars"></div>
  <div class="card" id="card"><div class="big" id="emo"></div><div class="word" id="wd"></div></div>
  <div class="msg" id="msg"></div>
  <div class="choices" id="ch">
    <button id="bV">🌱 VIVANT</button>
    <button id="bN">🪨 NON VIVANT</button>
  </div>
  <div class="hint hide" id="hint"></div>
  <button class="next hide" id="next">Suivant ➜</button>
  <div class="card hide" id="end"><div class="big">🏆</div><div class="word" id="score"></div>
    <button class="next" id="again">🔁 Rejouer</button></div>
</section>

<section id="signes" class="hide">
  <h2>Un être vivant…</h2>
  <div class="grid" id="sg"></div>
  <div class="q3" style="margin-top:14px">🔎 <b>Les 3 questions magiques :</b><br>Ça mange ? 🍽️<br>Ça grandit ? 📏<br>Ça naît ? 👶<br>Si oui → c’est <b>vivant</b> !</div>
</section>

<section id="cartes" class="hide">
  <h2>Cartes à découper</h2>
  <p class="note"><a href="cartes-vivant-non-vivant.pdf" style="font-size:20px;font-weight:bold;color:#2a6f9c">📄 Ouvrir le PDF à imprimer</a><br>Voici un aperçu des cartes.</p>
  <div class="sheet"><div class="cut" id="cuts"></div></div>
</section>

</main>
<script>
const V=[
 ["🐱","le chat","Il mange, il grandit, il respire, il a des bébés."],
 ["🐶","le chien","Il mange, il grandit, il respire, il a des bébés."],
 ["🌻","la fleur","Elle boit de l’eau, elle grandit, elle naît d’une graine."],
 ["🌳","l’arbre","Il boit de l’eau, il grandit, il naît d’une graine."],
 ["🧒","l’enfant","Il mange, il grandit, il respire, il parle."],
 ["🐦","l’oiseau","Il mange, il grandit, il respire, il naît d’un œuf."],
 ["🐟","le poisson","Il mange, il grandit, il respire dans l’eau."],
 ["🦋","le papillon","Il mange, il grandit, il naît d’un œuf."]
];
const N=[
 ["🪨","la pierre","Elle ne mange pas, elle ne grandit pas, elle ne naît pas."],
 ["🚗","la voiture","Elle roule, mais elle ne mange pas et ne grandit pas."],
 ["⚽","le ballon","Il ne mange pas, il ne grandit pas, il ne respire pas."],
 ["🪑","la chaise","Elle ne mange pas, elle ne grandit pas. Elle est fabriquée."],
 ["📕","le livre","Il ne mange pas, il ne grandit pas. Il est fabriqué."],
 ["🏠","la maison","Elle ne mange pas, elle ne grandit pas. Elle est construite."],
 ["🧸","le nounours","Il ressemble à un animal, mais il ne mange pas et ne grandit pas."],
 ["☀️","le soleil","Il brille, mais il ne mange pas, il ne grandit pas, il ne naît pas."]
];
const items=[...V.map(x=>[...x,true]),...N.map(x=>[...x,false])];
const $=id=>document.getElementById(id);
let deck,i,pts,answered;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){deck=shuffle([...items]).slice(0,10);i=0;pts=0;$("end").classList.add("hide");$("card").classList.remove("hide");$("ch").classList.remove("hide");show()}
function show(){
  answered=false;const it=deck[i];
  $("emo").textContent=it[0];$("wd").textContent=it[1];$("msg").textContent="";
  $("hint").classList.add("hide");$("next").classList.add("hide");$("ch").classList.remove("hide");
  $("stars").textContent="⭐".repeat(pts)+"▫️".repeat(deck.length-i-(0))+"";
  $("stars").textContent="Question "+(i+1)+" / "+deck.length+"   ⭐ "+pts;
}
function answer(isV){
  if(answered)return;answered=true;const it=deck[i];const good=(isV===it[3]);
  const m=$("msg"),c=$("card");
  c.classList.remove("shake","pop");void c.offsetWidth;
  if(good){pts++;m.textContent="✅ Bravo !";m.className="msg ok";c.classList.add("pop")}
  else{m.textContent=it[3]?"❌ C’est VIVANT 🌱":"❌ C’est NON VIVANT 🪨";m.className="msg ko";c.classList.add("shake")}
  $("hint").textContent="💡 "+it[2];$("hint").classList.remove("hide");
  $("next").classList.remove("hide");$("ch").classList.add("hide");
  $("stars").textContent="Question "+(i+1)+" / "+deck.length+"   ⭐ "+pts;
}
$("bV").onclick=()=>answer(true);$("bN").onclick=()=>answer(false);
$("next").onclick=()=>{i++;if(i>=deck.length){$("card").classList.add("hide");$("ch").classList.add("hide");$("hint").classList.add("hide");$("next").classList.add("hide");$("msg").textContent="";$("score").textContent=pts+" / "+deck.length+" ⭐";$("end").classList.remove("hide")}else show()};
$("again").onclick=start;

const S=[["🤰","avoir des bébés"],["👶","naître"],["🍽️","manger et boire"],["🚽","faire ses besoins"],["📏","grandir"],["🌬️","respirer"],["💬","communiquer"],["⚰️","mourir"]];
$("sg").innerHTML=S.map(s=>`<div class="mini"><div class="e">${s[0]}</div><div class="w">${s[1]}</div></div>`).join("");
$("cuts").innerHTML=items.map(x=>`<div class="c ${x[3]?'v':'n'}"><div class="e">${x[0]}</div><div class="w">${x[1]}</div></div>`).join("");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  ["jeu","signes","cartes"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.t));
});
start();
</script>
</body>
</html>
